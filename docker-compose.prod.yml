# SERVER stack (staging/prod). Images come from GHCR, tagged by git SHA or version.
# Usage on server:  IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 20
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/devops-lab-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RUN_MIGRATIONS: "true"
    depends_on: { db: { condition: service_healthy } }
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/devops-lab-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [backend]
volumes:
  dbdata:
