# LOCAL full stack:  docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      retries: 20
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    environment:
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: "true"
    depends_on: { db: { condition: service_healthy } }
  # frontend:
  #   build: { context: ., dockerfile: docker/frontend.Dockerfile }
  #   ports: ["8080:80"]
  #   depends_on: [backend]

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  dbdata:
